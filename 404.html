<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07090d">
  <title>404 · mrzroot</title>
  <link rel="icon" href="/website-portfolio-demos/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0}
    html{color-scheme:dark;background:#07090d}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Geist",system-ui,sans-serif;color:#e7ecf3;
      background-image:linear-gradient(to right,rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(148,163,184,.06) 1px,transparent 1px);
      background-size:64px 64px}
    main{width:min(560px,100%);border:1px solid rgba(148,163,184,.24);border-radius:16px;background:rgba(11,15,22,.94);overflow:hidden;box-shadow:0 30px 80px -30px #000,0 0 80px -40px rgba(34,211,238,.45)}
    .bar{display:flex;gap:7px;align-items:center;height:40px;padding:0 14px;border-bottom:1px solid rgba(148,163,184,.12)}
    .bar i{width:11px;height:11px;border-radius:50%;background:#f87171;opacity:.75}.bar i+i{background:#fbbf24}.bar i+i+i{background:#4ade80}
    .bar span{flex:1;text-align:center;font:12px "JetBrains Mono",monospace;color:#657189}
    pre{padding:22px;font:13.5px/1.75 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;color:#9aa6b8}
    .p{color:#22d3ee}.e{color:#fca5a5}.d{color:#657189}
    h1{padding:0 22px 6px;font-size:clamp(2rem,6vw,2.6rem);letter-spacing:-.04em;font-weight:600}
    p{padding:0 22px;color:#9aa6b8}
    nav{display:flex;flex-wrap:wrap;gap:10px;padding:22px}
    a{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:11px;border:1px solid rgba(148,163,184,.24);color:#e7ecf3;text-decoration:none;font-size:14.5px}
    a.primary{background:#e7ecf3;color:#06080c;border-color:transparent;font-weight:500}
    a:hover{border-color:rgba(34,211,238,.5)}
    a:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>mrz@root: ~</span></div>
    <pre><span class="p">$</span> cd <span id="path">this-page</span>
<span class="e">cd: no such file or directory</span>
<span class="d"># exit code 404</span></pre>
    <h1>Page not found.</h1>
    <p>The link may be old or mistyped. Everything still lives on the portfolio.</p>
    <nav>
      <a class="primary" href="/website-portfolio-demos/">Back to portfolio</a>
      <a href="/website-portfolio-demos/demos/">Live demos</a>
      <a href="https://github.com/mrzroot">GitHub</a>
    </nav>
  </main>
  <script>document.getElementById('path').textContent = location.pathname.replace(/^\/website-portfolio-demos/, '') || '/';</script>
</body>
</html>
